<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 1796 Pit Display</title>

<link rel="stylesheet" href="visual%20design/style.css">
</head>

<body>

    <header class="dashboard-header">

        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLCcJ4otQcP5XXfnwIeJ2IT44sU_lmiczEvCCfchygDduRoiOeeDiO_nyV&s=10"
            alt="RoboTigers Team 1796 Logo"
            class="team-logo"
        >

        <div class="header-text">

            <img
                src="https://static.wixstatic.com/media/1f72b0_c295e0e976d748c5982b8f63b551c2e2~mv2.png/v1/fill/w_352,h_64,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/RoboTigers%20Team%201796%20(2).png"
                alt="RoboTigers"
                class="team-name"
            >

            <p>PIT DISPLAY • LONG ISLAND REGIONAL</p>

        </div>

        <div class="clock-container">
            <div id="clock"></div>
            <div id="date"></div>
        </div>

    </header>


    <div class="toolbar">
        <button id="reset-layout">RESET DASHBOARD LAYOUT</button>
    </div>


    <main class="dashboard">

        <section class="panel current-match">
            <h2>CURRENT MATCH</h2>
            <h3>WAITING FOR MATCH DATA</h3>
            <p>Match information will appear here.</p>
        </section>


        <section class="panel robot-status">
            <h2>ROBOT STATUS</h2>
            <h3>OFFLINE</h3>
            <p>Waiting for robot connection</p>
        </section>


        <section class="panel battery-panel">
            <h2>BATTERY CART</h2>
            <div class="battery-cart-grid" id="battery-cart-grid"></div>
        </section>


        <section class="panel diagnostics">
            <h2>DIAGNOSTIC CHECKLIST</h2>

            <label><input type="checkbox"> Battery secured</label><br>
            <label><input type="checkbox"> Battery voltage checked</label><br>
            <label><input type="checkbox"> Main breaker checked</label><br>
            <label><input type="checkbox"> CAN devices connected</label><br>
            <label><input type="checkbox"> Motors tested</label><br>
            <label><input type="checkbox"> Sensors working</label><br>
            <label><input type="checkbox"> Emergency stop tested</label><br>
            <label><input type="checkbox"> Robot code running</label><br>
            <label><input type="checkbox"> Intake works</label><br>
            <label><input type="checkbox"> Drive works</label><br>
            <label><input type="checkbox"> Outtake works</label><br>
            <label><input type="checkbox"> Auto works</label><br>

        </section>

        <section class="panel match-schedule">
        <h2>MATCH SCHEDULE</h2>
        </section>    
        
    </main>

    


<script src="website%20function/script.js"></script>

</body>
</html>
